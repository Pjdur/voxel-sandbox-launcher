<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Sandbox Launcher</title>
  <script type="module" src="src/main.js" defer></script>
</head>

<body>
  <div class="menu-container">
    <!-- MAIN MENU -->
    <div id="main-menu">
      <p>Select a mode</p>
      <div class="menu-item" id="btn-singleplayer">Singleplayer</div>
      <div class="menu-item" id="btn-multiplayer">Multiplayer</div>
    </div>

    <!-- WORLD SELECTOR MENU (Hidden by default) -->
    <div id="world-menu" style="display: none;">
      <p id="world-menu-title">Select a World</p>
      
      <div class="input-group">
        <input type="text" id="new-world-input" placeholder="World Name..." style="width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none;" />
        <div class="menu-item btn-primary" id="btn-create-world">Play World</div>
      </div>

      <div class="menu-item btn-secondary" id="btn-back">← Back</div>
    </div>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Sandbox Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #87CEEB; user-select: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background-color: rgba(255, 255, 255, 0.7); }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        #instructions { position: absolute; bottom: 20px; left: 20px; color: white; background-color: rgba(0, 0, 0, 0.5); padding: 15px; border-radius: 8px; font-size: 14px; pointer-events: none; }
        #coordinates { position: absolute; top: 20px; left: 20px; color: white; background-color: rgba(0, 0, 0, 0.5); padding: 10px 14px; border-radius: 8px; font-family: monospace; font-size: 14px; pointer-events: none; display: none; }
        #hud-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; pointer-events: auto; }
        .hud-btn { background-color: rgba(0, 0, 0, 0.6); color: white; border: 2px solid white; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .hud-btn:hover { background-color: rgba(255, 255, 255, 0.3); }
        #player-count { position: absolute; top: 20px; right: 20px; color: #fff; background-color: rgba(0, 0, 0, 0.6); padding: 10px 16px; border-radius: 8px; font-weight: bold; pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.2); }
        #block-selector { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background-color: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 8px; pointer-events: auto; }
        .block-option { width: 40px; height: 40px; border: 2px solid transparent; cursor: pointer; border-radius: 4px; transition: transform 0.1s, border-color 0.1s; }
        .block-option.active { border-color: white; transform: scale(1.1); }
        #opt-dirt { background-color: #654321; } #opt-grass { background-color: #556B2F; } #opt-stone { background-color: #808080; } #opt-wood { background-color: #8B4513; } #opt-leaves { background-color: #228B22; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>
    <div id="ui"><h1 id="start-msg">Click to Play</h1></div>
    <div id="crosshair" style="display: none;"></div>
    <div id="coordinates">X: 0 | Y: 0 | Z: 0</div>
    <div id="instructions" style="display: none;"><strong>Controls:</strong><br>W, A, S, D - Move<br>Space - Jump<br>Left Click - Break | Right Click - Place<br>1-5 - Select Block Type</div>
    
    <!-- Dynamic UI dependent on mode -->
    <div id="hud-controls" style="display: none;">
        <button class="hud-btn" id="save-btn">Save (S)</button>
        <button class="hud-btn" id="load-btn">Load (L)</button>
    </div>
    <div id="player-count" style="display: none;">Online: 1</div>

    <div id="block-selector" style="display: none;">
        <div class="block-option active" id="opt-dirt" title="Dirt (1)"></div>
        <div class="block-option" id="opt-grass" title="Grass (2)"></div>
        <div class="block-option" id="opt-stone" title="Stone (3)"></div>
        <div class="block-option" id="opt-wood" title="Wood (4)"></div>
        <div class="block-option" id="opt-leaves" title="Leaves (5)"></div>
    </div>

    <script>
        // --- PARSE MODE CONFIG ---
        const urlParams = new URLSearchParams(window.location.search);
        const GAME_MODE = urlParams.get('mode') || 'singleplayer';
        const WORLD_NAME = urlParams.get('world') || 'default';
        const PORT = urlParams.get('port') || '8080';

        // Set UI based on Mode
        if (GAME_MODE === 'multiplayer') {
            document.getElementById('player-count').style.display = 'block';
        } else {
            document.getElementById('hud-controls').style.display = 'flex';
        }

        // --- GAME ENGINE ---
        const CHUNK_SIZE = 16, WORLD_HEIGHT = 32, BLOCK_SIZE = 1, RENDER_DISTANCE = 3;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, (RENDER_DISTANCE * CHUNK_SIZE * BLOCK_SIZE) - 5);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50);
        scene.add(dirLight);

        const BLOCK = { AIR: 0, DIRT: 1, GRASS: 2, STONE: 3, WOOD: 4, LEAVES: 5 };
        const world = new Map();
        const savedModifications = {};
        const otherPlayers = {};

        // --- MULTIPLAYER WEBSOCKET ---
        let socket = null;
        if (GAME_MODE === 'multiplayer') {
            socket = new WebSocket(`ws://localhost:${PORT}`);
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'init') {
                    Object.assign(savedModifications, data.blocks);
                    world.clear(); chunkGroup.clear(); lastChunkX = null; lastChunkZ = null;
                    updateChunksIfNeeded();
                } else if (data.type === 'playerCount') {
                    document.getElementById('player-count').innerText = `Online: ${data.count}`;
                } else if (data.type === 'move') {
                    let playerMesh = otherPlayers[data.id];
                    if (!playerMesh) {
                        const geom = new THREE.BoxGeometry(0.6, 1.8, 0.6);
                        const mat = new THREE.MeshLambertMaterial({ color: 0xff4500 });
                        playerMesh = new THREE.Mesh(geom, mat);
                        scene.add(playerMesh);
                        otherPlayers[data.id] = playerMesh;
                    }
                    playerMesh.position.set(data.x, data.y - 0.75, data.z);
                    if (data.quaternion) playerMesh.quaternion.set(data.quaternion._x, data.quaternion._y, data.quaternion._z, data.quaternion._w);
                } else if (data.type === 'blockUpdate') {
                    savedModifications[`${data.x},${data.y},${data.z}`] = data.blockType;
                    const cx = Math.floor(data.x / CHUNK_SIZE), cz = Math.floor(data.z / CHUNK_SIZE);
                    const key = `${cx},${cz}`;
                    if (world.has(key)) {
                        let lx = data.x % CHUNK_SIZE; if (lx < 0) lx += CHUNK_SIZE;
                        let lz = data.z % CHUNK_SIZE; if (lz < 0) lz += CHUNK_SIZE;
                        world.get(key).data[lx + (lz * CHUNK_SIZE) + (data.y * CHUNK_SIZE * CHUNK_SIZE)] = data.blockType;
                        buildChunkMesh(cx, cz);
                    }
                } else if (data.type === 'disconnect' && otherPlayers[data.id]) {
                    scene.remove(otherPlayers[data.id]);
                    delete otherPlayers[data.id];
                }
            };
        }

        // --- TEXTURES & MATERIALS ---
        const textureLoader = new THREE.TextureLoader();
        function loadTexture(url) {
            const tex = textureLoader.load(url);
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }
        
        // Ensure you have these images in the tauri build! If not, standard colors fallback is needed, but we keep your setup.
        const dirtTex = loadTexture('textures/dirt.png'); 
        const grassTopTex = loadTexture('textures/grass_top.png');
        const grassSideTex = loadTexture('textures/grass_side.png');
        const stoneTex = loadTexture('textures/stone.png');
        const woodTex = loadTexture('textures/wood.png');
        const leavesTex = loadTexture('textures/leaves.png');

        const materials = {
            [BLOCK.DIRT]: new THREE.MeshLambertMaterial({ map: dirtTex }),
            [BLOCK.GRASS]: [
                new THREE.MeshLambertMaterial({ map: grassSideTex }), new THREE.MeshLambertMaterial({ map: grassSideTex }),
                new THREE.MeshLambertMaterial({ map: grassTopTex }), new THREE.MeshLambertMaterial({ map: dirtTex }),
                new THREE.MeshLambertMaterial({ map: grassSideTex }), new THREE.MeshLambertMaterial({ map: grassSideTex })
            ],
            [BLOCK.STONE]: new THREE.MeshLambertMaterial({ map: stoneTex }),
            [BLOCK.WOOD]: new THREE.MeshLambertMaterial({ map: woodTex }),
            [BLOCK.LEAVES]: new THREE.MeshLambertMaterial({ map: leavesTex, transparent: true, alphaTest: 0.1 })
        };
        const blockGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        const dummy = new THREE.Object3D();
        
        // --- CHUNK GEN ---
        function seededRandom(seed) { return function () { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
        const simplex = new SimplexNoise(seededRandom(12345));

        function generateChunk(cx, cz) {
            const chunkData = new Uint8Array(CHUNK_SIZE * WORLD_HEIGHT * CHUNK_SIZE);
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const gx = (cx * CHUNK_SIZE) + x, gz = (cz * CHUNK_SIZE) + z;
                    const noiseVal = simplex.noise2D(gx / 50, gz / 50);
                    const height = Math.floor(10 + (noiseVal + 1) * 5);
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        const idx = x + (z * CHUNK_SIZE) + (y * CHUNK_SIZE * CHUNK_SIZE);
                        if (y < height - 3) chunkData[idx] = BLOCK.STONE;
                        else if (y < height - 1) chunkData[idx] = BLOCK.DIRT;
                        else if (y === height - 1) {
                            chunkData[idx] = BLOCK.GRASS;
                            if (Math.abs(Math.sin(gx * 12.989 + gz * 78.23)) % 1 < 0.02 && x>2 && x<CHUNK_SIZE-2 && z>2 && z<CHUNK_SIZE-2) {
                                generateTree(cx, cz, x, y + 1, z, chunkData);
                            }
                        }
                    }
                }
            }
            for (let key in savedModifications) {
                const [gx, gy, gz] = key.split(',').map(Number);
                const pcx = Math.floor(gx / CHUNK_SIZE), pcz = Math.floor(gz / CHUNK_SIZE);
                if (pcx === cx && pcz === cz && gy >= 0 && gy < WORLD_HEIGHT) {
                    let lx = gx % CHUNK_SIZE; if (lx < 0) lx += CHUNK_SIZE;
                    let lz = gz % CHUNK_SIZE; if (lz < 0) lz += CHUNK_SIZE;
                    chunkData[lx + (lz * CHUNK_SIZE) + (gy * CHUNK_SIZE * CHUNK_SIZE)] = savedModifications[key];
                }
            }
            return chunkData;
        }

        function generateTree(cx, cz, lx, ly, lz, chunkData) {
            const treeHeight = 4 + (Math.abs(lx * lz) % 3);
            for (let i = 0; i < treeHeight; i++) if (ly + i < WORLD_HEIGHT) chunkData[lx + (lz * CHUNK_SIZE) + ((ly + i) * CHUNK_SIZE * CHUNK_SIZE)] = BLOCK.WOOD;
            const topY = ly + treeHeight;
            for (let y = topY - 2; y <= topY + 1; y++) {
                const r = y >= topY ? 1 : 2;
                for (let x = lx - r; x <= lx + r; x++) {
                    for (let z = lz - r; z <= lz + r; z++) {
                        if (x>=0 && x<CHUNK_SIZE && z>=0 && z<CHUNK_SIZE && y<WORLD_HEIGHT && (x!==lx || z!==lz || y>topY) && (Math.abs(x-lx)+Math.abs(z-lz) <= r*1.5)) {
                            const idx = x + (z * CHUNK_SIZE) + (y * CHUNK_SIZE * CHUNK_SIZE);
                            if (chunkData[idx] === BLOCK.AIR) chunkData[idx] = BLOCK.LEAVES;
                        }
                    }
                }
            }
        }

        function getBlock(gx, gy, gz) {
            if (gy < 0 || gy >= WORLD_HEIGHT) return BLOCK.AIR;
            const cx = Math.floor(gx / CHUNK_SIZE), cz = Math.floor(gz / CHUNK_SIZE), key = `${cx},${cz}`;
            if (!world.has(key)) return BLOCK.AIR;
            let lx = gx % CHUNK_SIZE; if (lx < 0) lx += CHUNK_SIZE;
            let lz = gz % CHUNK_SIZE; if (lz < 0) lz += CHUNK_SIZE;
            return world.get(key).data[lx + (lz * CHUNK_SIZE) + (gy * CHUNK_SIZE * CHUNK_SIZE)];
        }

        function setBlock(gx, gy, gz, type) {
            if (gy < 0 || gy >= WORLD_HEIGHT) return;
            savedModifications[`${gx},${gy},${gz}`] = type;
            const cx = Math.floor(gx / CHUNK_SIZE), cz = Math.floor(gz / CHUNK_SIZE), key = `${cx},${cz}`;
            if (!world.has(key)) return;
            let lx = gx % CHUNK_SIZE; if (lx < 0) lx += CHUNK_SIZE;
            let lz = gz % CHUNK_SIZE; if (lz < 0) lz += CHUNK_SIZE;
            world.get(key).data[lx + (lz * CHUNK_SIZE) + (gy * CHUNK_SIZE * CHUNK_SIZE)] = type;
            buildChunkMesh(cx, cz);
        }

        const chunkGroup = new THREE.Group(); scene.add(chunkGroup);

        function buildChunkMesh(cx, cz) {
            const key = `${cx},${cz}`;
            const chunkObj = world.get(key);
            if (!chunkObj) return;
            if (chunkObj.meshes) for (let type in chunkObj.meshes) chunkGroup.remove(chunkObj.meshes[type]);
            chunkObj.meshes = {};
            const counts = {};
            for (let i = 0; i < chunkObj.data.length; i++) {
                const t = chunkObj.data[i];
                if (t !== BLOCK.AIR) counts[t] = (counts[t] || 0) + 1;
            }
            for (const type in counts) {
                const mesh = new THREE.InstancedMesh(blockGeometry, materials[type], counts[type]);
                chunkObj.meshes[type] = mesh; chunkGroup.add(mesh);
            }
            const currentCounts = {};
            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        const index = x + (z * CHUNK_SIZE) + (y * CHUNK_SIZE * CHUNK_SIZE);
                        const type = chunkObj.data[index];
                        if (type !== BLOCK.AIR) {
                            let isVisible = false;
                            if (y===WORLD_HEIGHT-1 || chunkObj.data[index+CHUNK_SIZE*CHUNK_SIZE]===BLOCK.AIR) isVisible = true;
                            else if (y===0 || chunkObj.data[index-CHUNK_SIZE*CHUNK_SIZE]===BLOCK.AIR) isVisible = true;
                            else if (x===0 || chunkObj.data[index-1]===BLOCK.AIR) isVisible = true;
                            else if (x===CHUNK_SIZE-1 || chunkObj.data[index+1]===BLOCK.AIR) isVisible = true;
                            else if (z===0 || chunkObj.data[index-CHUNK_SIZE]===BLOCK.AIR) isVisible = true;
                            else if (z===CHUNK_SIZE-1 || chunkObj.data[index+CHUNK_SIZE]===BLOCK.AIR) isVisible = true;

                            if (isVisible) {
                                dummy.position.set((cx * CHUNK_SIZE) + x, y, (cz * CHUNK_SIZE) + z);
                                dummy.updateMatrix();
                                const c = currentCounts[type] || 0;
                                chunkObj.meshes[type].setMatrixAt(c, dummy.matrix);
                                currentCounts[type] = c + 1;
                            }
                        }
                    }
                }
            }
            for (const type in chunkObj.meshes) { chunkObj.meshes[type].count = currentCounts[type] || 0; chunkObj.meshes[type].instanceMatrix.needsUpdate = true; }
        }

        let lastChunkX = null, lastChunkZ = null;
        function updateChunksIfNeeded() {
            const pcx = Math.floor(camera.position.x / CHUNK_SIZE), pcz = Math.floor(camera.position.z / CHUNK_SIZE);
            if (pcx !== lastChunkX || pcz !== lastChunkZ) {
                lastChunkX = pcx; lastChunkZ = pcz;
                for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
                    for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
                        const cx = pcx + x, cz = pcz + z, key = `${cx},${cz}`;
                        if (!world.has(key)) { world.set(key, { data: generateChunk(cx, cz) }); buildChunkMesh(cx, cz); }
                    }
                }
            }
        }

        // --- SINGLEPLAYER LOCAL STORAGE ---
        function saveGame() {
            if (GAME_MODE === 'multiplayer') return;
            const camObj = controls.getObject();
            const saveData = { blocks: savedModifications, playerPos: { x: camObj.position.x, y: camObj.position.y, z: camObj.position.z } };
            localStorage.setItem('voxelSandboxSave_' + WORLD_NAME, JSON.stringify(saveData));
            alert(`World '${WORLD_NAME}' Saved!`);
        }
        function loadGame() {
            if (GAME_MODE === 'multiplayer') return;
            const savedData = localStorage.getItem('voxelSandboxSave_' + WORLD_NAME);
            if (savedData) {
                const parsed = JSON.parse(savedData);
                for (let k in savedModifications) delete savedModifications[k];
                if (parsed.blocks) {
                    Object.assign(savedModifications, parsed.blocks);
                    if (parsed.playerPos) { controls.getObject().position.set(parsed.playerPos.x, parsed.playerPos.y, parsed.playerPos.z); velocity.set(0,0,0); }
                }
                world.clear(); chunkGroup.clear(); lastChunkX = null; lastChunkZ = null; updateChunksIfNeeded();
                alert(`World '${WORLD_NAME}' Loaded!`);
            } else alert("No save found for this world!");
        }
        if (document.getElementById('save-btn')) document.getElementById('save-btn').addEventListener('click', saveGame);
        if (document.getElementById('load-btn')) document.getElementById('load-btn').addEventListener('click', loadGame);

        // --- CONTROLS ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        document.body.addEventListener('click', (e) => { if (!e.target.closest('#hud-controls') && !e.target.closest('#block-selector') && !controls.isLocked) controls.lock(); }, false);
        controls.addEventListener('lock', () => {
            document.getElementById('ui').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block'; document.getElementById('coordinates').style.display = 'block';
            document.getElementById('instructions').style.display = 'block'; document.getElementById('block-selector').style.display = 'flex';
        });
        controls.addEventListener('unlock', () => {
            document.getElementById('ui').style.display = 'block'; document.getElementById('start-msg').innerText = "Click to Resume";
            document.getElementById('crosshair').style.display = 'none'; document.getElementById('coordinates').style.display = 'none';
            document.getElementById('instructions').style.display = 'none'; document.getElementById('block-selector').style.display = 'none';
        });

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(); const gravity = 40.0, speed = 10.0, jumpVelocity = 15.0;
        camera.position.set(CHUNK_SIZE / 2, WORLD_HEIGHT, CHUNK_SIZE / 2);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyS' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); return; }
            if (e.code === 'KeyS' && !controls.isLocked && GAME_MODE === 'singleplayer') { saveGame(); return; }
            if (e.code === 'KeyL' && !controls.isLocked && GAME_MODE === 'singleplayer') { loadGame(); return; }

            switch (e.code) {
                case 'KeyW': moveForward = true; break; case 'KeyA': moveLeft = true; break;
                case 'KeyS': if (controls.isLocked) moveBackward = true; break; case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) { velocity.y = jumpVelocity; canJump = false; } break;
                case 'Digit1': selectBlock(BLOCK.DIRT, 'opt-dirt'); break; case 'Digit2': selectBlock(BLOCK.GRASS, 'opt-grass'); break;
                case 'Digit3': selectBlock(BLOCK.STONE, 'opt-stone'); break; case 'Digit4': selectBlock(BLOCK.WOOD, 'opt-wood'); break;
                case 'Digit5': selectBlock(BLOCK.LEAVES, 'opt-leaves'); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break; case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break; case 'KeyD': moveRight = false; break;
            }
        });

        let currentBlockSelection = BLOCK.DIRT;
        function selectBlock(type, id) {
            currentBlockSelection = type;
            document.querySelectorAll('.block-option').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        const outlineGeo = new THREE.BoxGeometry(BLOCK_SIZE + 0.01, BLOCK_SIZE + 0.01, BLOCK_SIZE + 0.01);
        const blockOutline = new THREE.LineSegments(new THREE.EdgesGeometry(outlineGeo), new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
        blockOutline.visible = false; scene.add(blockOutline);

        function getTargetBlock() {
            const start = camera.position.clone(), dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
            let pos = start.clone(), lastBx = Math.round(pos.x), lastBy = Math.round(pos.y), lastBz = Math.round(pos.z);
            for (let d = 0; d <= 5.0; d += 0.05) {
                pos.addVectors(start, dir.clone().multiplyScalar(d));
                const bx = Math.round(pos.x), by = Math.round(pos.y), bz = Math.round(pos.z);
                if (getBlock(bx, by, bz) !== BLOCK.AIR) return { position: new THREE.Vector3(bx, by, bz), normal: new THREE.Vector3(lastBx - bx, lastBy - by, lastBz - bz) };
                lastBx = bx; lastBy = by; lastBz = bz;
            }
            return null;
        }

        let isMouseDown = false, mouseButton = null, actionTimer = 0;
        function executeBlockAction(button) {
            const target = getTargetBlock();
            if (target) {
                if (button === 0) {
                    setBlock(target.position.x, target.position.y, target.position.z, BLOCK.AIR);
                    if (GAME_MODE === 'multiplayer' && socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'blockUpdate', x: target.position.x, y: target.position.y, z: target.position.z, blockType: BLOCK.AIR }));
                } else if (button === 2) {
                    const px = target.position.x + target.normal.x, py = target.position.y + target.normal.y, pz = target.position.z + target.normal.z;
                    if (Math.abs(camera.position.x - px) < 0.8 && py >= Math.floor(camera.position.y - 1.5) && py <= camera.position.y && Math.abs(camera.position.z - pz) < 0.8) return;
                    if (py < WORLD_HEIGHT && py >= 0) {
                        setBlock(px, py, pz, currentBlockSelection);
                        if (GAME_MODE === 'multiplayer' && socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'blockUpdate', x: px, y: py, z: pz, blockType: currentBlockSelection }));
                    }
                }
            }
        }
        document.addEventListener('mousedown', (e) => { if (controls.isLocked && !e.target.closest('#hud-controls') && !e.target.closest('#block-selector')) { isMouseDown = true; mouseButton = e.button; actionTimer = 0; executeBlockAction(mouseButton); }});
        document.addEventListener('mouseup', () => { isMouseDown = false; mouseButton = null; });
        document.addEventListener('contextmenu', e => e.preventDefault());

        function checkCollision(pos) {
            const w = 0.3, h = 1.6, eyeY = 1.5;
            const pts = [
                new THREE.Vector3(pos.x - w, pos.y - eyeY, pos.z - w), new THREE.Vector3(pos.x + w, pos.y - eyeY, pos.z - w),
                new THREE.Vector3(pos.x - w, pos.y - eyeY, pos.z + w), new THREE.Vector3(pos.x + w, pos.y - eyeY, pos.z + w),
                new THREE.Vector3(pos.x - w, pos.y - eyeY + h, pos.z - w), new THREE.Vector3(pos.x + w, pos.y - eyeY + h, pos.z - w),
                new THREE.Vector3(pos.x - w, pos.y - eyeY + h, pos.z + w), new THREE.Vector3(pos.x + w, pos.y - eyeY + h, pos.z + w)
            ];
            for (let p of pts) if (getBlock(Math.round(p.x), Math.round(p.y), Math.round(p.z)) !== BLOCK.AIR) return true;
            return false;
        }

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(), delta = Math.min((time - prevTime) / 1000, 0.1); prevTime = time;

            if (controls.isLocked) {
                if (GAME_MODE === 'multiplayer' && socket?.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'move', x: camera.position.x, y: camera.position.y, z: camera.position.z, quaternion: camera.quaternion }));
                }

                const moveStep = speed * delta;
                if (moveForward) { controls.moveForward(moveStep); if (checkCollision(camera.position)) controls.moveForward(-moveStep); }
                if (moveBackward) { controls.moveForward(-moveStep); if (checkCollision(camera.position)) controls.moveForward(moveStep); }
                if (moveRight) { controls.moveRight(moveStep); if (checkCollision(camera.position)) controls.moveRight(-moveStep); }
                if (moveLeft) { controls.moveRight(-moveStep); if (checkCollision(camera.position)) controls.moveRight(moveStep); }

                if (isMouseDown) {
                    actionTimer += delta;
                    if (actionTimer >= ((mouseButton === 0) ? 0.3 : 0.5)) { actionTimer = 0; executeBlockAction(mouseButton); }
                }

                velocity.y -= gravity * delta; camera.position.y += velocity.y * delta;
                if (checkCollision(camera.position)) { if (velocity.y < 0) { canJump = true; camera.position.y = Math.floor(camera.position.y - 1.5) + 0.5 + 1.501; } velocity.y = 0; } else canJump = false;
                if (camera.position.y < -10) { velocity.y = 0; camera.position.set(CHUNK_SIZE / 2, WORLD_HEIGHT + 5, CHUNK_SIZE / 2); }

                document.getElementById('coordinates').innerText = `X: ${Math.floor(camera.position.x)} | Y: ${Math.floor(camera.position.y - 1.5)} | Z: ${Math.floor(camera.position.z)}`;
                const target = getTargetBlock();
                if (target) { blockOutline.visible = true; blockOutline.position.copy(target.position); } else blockOutline.visible = false;
                updateChunksIfNeeded();
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }, false);
        updateChunksIfNeeded(); window.onload = animate;
    </script>
</body>
